<!doctype html>
<html>

      html, body { margin: 0; padding: 0; background: transparent; }
      svg { display: block; width: 100vw; height: 100vh; }

  <body>
    <!--
      16/32px favicon. Same geometry as the brand mark, minus the tassel: at
      16px the tassel is sub-pixel and lands as a grey smudge. Strokes are
      thickened slightly so the edges survive downscaling.
    -->
    <svg viewBox="-4 -4 72 72" xmlns="http://www.w3.org/2000/svg">
      <rect x="-4" y="-4" width="72" height="72" rx="17" fill="#2563eb" />
      <g fill="#ffffff">
        <path
          d="M32 16.5 55 26 32 35.5 9 26Z"
          stroke="#ffffff"
          stroke-width="2.6"
          stroke-linejoin="round"
        />
        <path d="M20 28.5 32 34.5 44 28.5V38.5C44 44 39.3 47.3 32 47.3S20 44 20 38.5Z" />
      </g>
    </svg>
  </body>
